<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Best Seller</title>
<link rel="stylesheet" href="css/styles.css">
<style>
  /* Nella app html e body hanno height:100% e overflow:hidden, e lo scorrimento
     lo fa .scroll-area: qui invece la pagina è una pagina normale e deve
     scorrere lei, altrimenti resta bloccata sul podio. La barra filtri è
     position:sticky e continua a funzionare, agganciata al viewport. */
  html, body{height:auto;overflow:visible}
  body{margin:0;background:var(--bs-bg,#f6f5f3)}

  /* ── Caricamento ──────────────────────────────────────────────────────
     Velo a schermo intero sopra la pagina: la classifica si disegna sotto e
     quando è pronta il velo si dissolve, come lo splash della dashboard
     rappresentanti (opacity + visibility:hidden, nessun JS per l'animazione).
     Il testo eredita AdihausDIN da #tab-bestseller: niente Tailwind e niente
     import di font. */
  .bsload{position:fixed;inset:0;z-index:60;background:var(--bs-bg);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:clamp(32px,6vw,64px);overflow:hidden;
    transition:opacity .55s ease, visibility 0s .55s}
  .bsload-off{opacity:0;visibility:hidden}
  .bsload-logo{width:500px;max-width:80vw}
  .bsload-logo svg{width:100%;height:auto;fill:currentColor}
  .bsload-stripe{transform-origin:center bottom;transform-box:fill-box;
    animation:bsload-pulse 1.2s ease-in-out infinite}
  .bsload-s1{animation-delay:0s}
  .bsload-s2{animation-delay:.15s}
  .bsload-s3{animation-delay:.3s}
  @keyframes bsload-pulse{
    0%,100%{transform:scale(1);filter:brightness(1)}
    50%{transform:scale(1.08);filter:brightness(1.4)}}
  .bsload-bar{width:240px;height:2px;background:rgba(0,0,0,.05);border-radius:99px;
    position:relative;overflow:hidden}
  .bsload-bar i{position:absolute;height:100%;width:40%;background:var(--bs-ink);
    animation:bsload-bar 1.5s infinite cubic-bezier(.65,.05,.36,1)}
  @keyframes bsload-bar{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
  .bsload-txt{font-size:10px;letter-spacing:.5em;text-transform:uppercase;font-weight:700;
    animation:bsload-txt 2s ease-in-out infinite}
  @keyframes bsload-txt{0%,100%{opacity:.2}50%{opacity:.5}}
  /* Chi ha chiesto meno animazioni vede il logo fermo e il velo sparire di
     colpo, non una pagina bloccata. */
  @media (prefers-reduced-motion:reduce){
    .bsload-stripe,.bsload-bar i,.bsload-txt{animation:none}
    .bsload{transition:none}}
</style>
</head>
