<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Best Seller</title>
<link rel="stylesheet" href="css/styles.css">
<style>
  /* Vista pubblica: fuori tutto ciò che riguarda il valore. I numeri non
     arrivano nemmeno dal backend, questo serve a non lasciare celle a zero. */
  .bs-c-net, [data-sort="net"], .bs-pfoot > div:nth-child(3){display:none}
  /* Nella app html e body hanno height:100% e overflow:hidden, e lo scorrimento
     lo fa .scroll-area: qui invece la pagina è una pagina normale e deve
     scorrere lei, altrimenti resta bloccata sul podio. La barra filtri è
     position:sticky e continua a funzionare, agganciata al viewport. */
  html, body{height:auto;overflow:visible}
  body{margin:0;background:var(--bs-bg,#f6f5f3)}
</style>
</head>
<body>
<!-- L'id serve: le variabili di colore del modulo (--bs-ink, --bs-bg, --bs-red)
     sono dichiarate su #tab-bestseller in styles.css. Senza questo antenato non
     risolvono e la pagina esce bianca su bianco. -->
<div id="tab-bestseller">
  <div id="bs-root"></div>
</div>
<script src="js/09-bestseller.js"></script>
<script src="js/bs-public.js"></script>
</body>
</html>
